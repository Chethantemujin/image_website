<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        .logout {
            position: absolute;
            right: 20px;
            top: 20px;
        }

        .logout a {
            padding: 10px 15px;
            background: #ff4444;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .gallery img {
            width: 280px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.06);
        }
    </style>
</head>
<body>

<div class="logout">
    <a href="/logout">Logout</a>
</div>

<h1>Captured Images</h1>

<div class="gallery">
    {% for img in images %}
        <img src="{{ url_for('send_image', filename=img) }}" alt="Image">
    {% endfor %}
</div>

</body>
</html>
