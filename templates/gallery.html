<!DOCTYPE html>
<html>
<head>
    <title>Snapshot Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 20px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery img {
            width: 300px;
            height: auto;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>Snapshot Gallery</h1>

    <div class="gallery">
        {% for img in images %}
            <img src="{{ img }}" alt="snapshot">
        {% endfor %}
    </div>

</body>
</html>
